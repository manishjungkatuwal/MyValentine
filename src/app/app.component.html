<div class="main-container">
  <div class="sky" *ngIf="!accepted">
    <div *ngFor="let b of balloons" 
         class="balloon" 
         [style.left.%]="b.left" 
         [style.animation-delay.s]="b.delay">
      🎈
    </div>

    <div class="question-card">
      <div class="heart-icon">❤️</div>
      <h1>Will you be my Valentine?</h1>
      <div class="btn-group">
        <button class="yes-btn" (click)="onYes()">YES!</button>
        <button class="no-btn" (touchstart)="moveNo($event)" (mouseover)="moveNo($event)">No</button>
      </div>
    </div>
  </div>

  <div class="success-content" *ngIf="accepted">
    <div class="success-content" *ngIf="accepted">
      <div class="timeline-container">
        <h1 class="header-text">Our Journey So Far</h1>
        
        <div class="memory-card" *ngFor="let memory of memories">
          <div class="memory-date">{{ memory.date }}</div>
          <img [src]="'assets/photos/' + memory.image" class="memory-img" alt="Memory">
          <p class="memory-desc">{{ memory.description }}</p>
        </div>

        <div class="final-note">
          <p>And many more miles to go... I love you!</p>
        </div>
      </div>
    </div>
  </div>
</div>
